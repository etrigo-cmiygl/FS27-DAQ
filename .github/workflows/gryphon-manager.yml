name: Gryphon Manager

on:
  push:
    branches: [gryphon-manager]
    tags: ["manager-v*"]
    paths:
      - "manager/**"
      - "*.dbc"
      - ".github/workflows/gryphon-manager.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manager/requirements-dev.txt
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          pip install -r requirements-dev.txt
      - name: Tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manager/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build the app folder
        run: pyinstaller --noconfirm GryphonManager.spec
      - name: Self-test the built exe
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:GRYPHON_HOME = "$PWD\selftest-home"
          $p = Start-Process -FilePath "dist\GryphonManager\GryphonManager.exe" -ArgumentList "--selftest","selftest.png" -Wait -PassThru
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item README.md dist\GryphonManager\README.md
          Compress-Archive -Path dist\GryphonManager -DestinationPath GryphonManager-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GryphonManager-windows
          path: manager/GryphonManager-windows.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            manager/selftest.png
            manager/selftest.log
          if-no-files-found: ignore
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/manager-v')
        uses: softprops/action-gh-release@v2
        with:
          files: manager/GryphonManager-windows.zip
          name: Gryphon Manager ${{ github.ref_name }}
          generate_release_notes: true
